<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freak Melee administration</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <script type="module" src="/admin/admin.js"></script>
</head>
<body>
  <header><div><span class="eyebrow">FREAK MELEE</span><h1>Community desk</h1></div><span id="identity">News, announcements & feedback</span></header>
  <nav aria-label="Administration"><button data-tab="news" class="selected">News</button><button data-tab="announcements">Announcements</button><button data-tab="feedback">Feedback</button></nav>
  <div id="status" role="status" aria-live="polite"></div>
  <main>
    <aside><div class="list-heading"><h2 id="list-title">News</h2><button id="new">+ New</button></div>
      <label>Search<input id="search" type="search" maxlength="120" placeholder="Find by title"></label>
      <label id="filter-wrap" hidden>Status<select id="filter"><option value="">All reports</option><option value="new">New</option><option value="investigating">Investigating</option><option value="resolved">Resolved</option></select></label>
      <div id="records"></div><button id="older" hidden>Load older</button><p id="usage" class="muted"></p>
    </aside>
    <section id="editor"><form id="edit-form">
      <div class="editor-heading"><h2 id="editor-title">New article</h2><span id="revision" class="muted">Draft</span></div>
      <label>Title<input id="title" maxlength="120" required autocomplete="off"></label>
      <label id="ticker-wrap">Ticker text <span class="muted">Optional short headline</span><input id="ticker" maxlength="240"></label>
      <label>Text<textarea id="body" rows="13" maxlength="32000" required placeholder="Write your update here. Use # headings, - lists, [label](https://...) links, and blank lines for paragraphs."></textarea></label>
      <div class="two-column"><label class="check"><input type="checkbox" id="published">Published</label><label>Publication time<input type="datetime-local" id="published-at"></label></div>
      <div id="announcement-options" hidden><div class="two-column"><label>Expires <span class="muted">Optional</span><input type="datetime-local" id="expires-at"></label><label>Linked news article<select id="news-link"><option value="">None</option></select></label></div><label class="check"><input type="checkbox" id="withdrawn">Withdrawn</label><label class="check"><input type="checkbox" id="resend">Send again as a new notification</label></div>
      <label id="archive-wrap" class="check"><input type="checkbox" id="archived">Archived</label>
      <div class="actions"><button type="submit" class="primary" id="save">Save article</button><button type="button" id="preview-toggle">Preview</button><button type="button" id="discard">Discard local draft</button></div>
      <p class="muted" id="editor-help">Published articles appear in News. The newest headline appears in the ticker.</p>
    </form><article id="preview" hidden></article></section>
    <section id="report" hidden><div class="editor-heading"><h2>Feedback</h2><select id="report-status" aria-label="Report status"><option value="new">New</option><option value="investigating">Investigating</option><option value="resolved">Resolved</option></select></div><p id="report-meta" class="muted"></p><div id="report-image"><img id="screenshot" alt="Captured game screen"><div id="pins"></div></div><div id="notes"></div><div class="actions"><a id="download-context" download>Download diagnostic capture</a><a id="download-screen" download>Download screenshot</a><button id="delete-report">Delete report</button></div><pre id="context-preview"></pre></section>
  </main>
</body>
</html>
